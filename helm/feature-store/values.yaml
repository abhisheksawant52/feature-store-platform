replicaCount: 2

image:
  repository: ghcr.io/abhisheksawant52/feature-store-platform
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: feature-store.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Non-sensitive configuration surfaced via a ConfigMap and env vars.
config:
  environment: production
  logLevel: INFO
  offlineStoreUri: s3://feature-store/offline
  offlineStoreFormat: parquet
  redisKeyPrefix: fs
  onlineTtlSeconds: 86400

# Online store (Redis / ElastiCache) connection.
# Provide the URL via an existing secret in production; the placeholder secret
# in templates/secret.yaml is only for local/dev installs.
redis:
  existingSecret: ""
  secretKey: redis-url
  url: "redis://feature-store-redis:6379/0"

nodeSelector: {}
tolerations: []
affinity: {}
