{{- if not .Values.redis.existingSecret }}
# Placeholder secret for local/dev installs. In production, set
# redis.existingSecret to a secret managed outside of Helm (e.g. via
# External Secrets or SOPS) and remove the redis.url value.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feature-store.redisSecretName" . }}
  labels:
    {{- include "feature-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redis.secretKey }}: {{ .Values.redis.url | quote }}
{{- end }}
